name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  maps:
    name: wire maps + qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract A — provider-maps.cjs
        run: node tools/test-provider-maps.cjs
      - name: Contract B — provider-maps-hop.cjs
        run: node tools/test-provider-maps-hop.cjs
      - name: repo self-check (leaks, refs, compile)
        run: python tools/qa.py
