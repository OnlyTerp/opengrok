<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="opengrok — run any model in Grok Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a12"/>
      <stop offset="0.55" stop-color="#100e1c"/>
      <stop offset="1" stop-color="#171128"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.025">
    <path d="M0 160H1280M0 320H1280M0 480H1280"/>
    <path d="M320 0V640M640 0V640M960 0V640"/>
  </g>

  <!-- mark: three blobs, wired — right column, clears the pipeline band -->
  <g transform="translate(1050,80)">
    <g>
      <ellipse cx="0" cy="0" rx="42" ry="38" fill="#3b82f6"/>
      <rect x="-15" y="-15" width="8" height="24" rx="4" fill="#101012"/>
      <rect x="7" y="-15" width="8" height="24" rx="4" fill="#101012"/>
    </g>
    <g transform="translate(120,220)">
      <ellipse cx="0" cy="0" rx="42" ry="38" fill="#10b981"/>
      <rect x="-15" y="-15" width="8" height="24" rx="4" fill="#101012"/>
      <rect x="7" y="-15" width="8" height="24" rx="4" fill="#101012"/>
    </g>
    <g transform="translate(10,420)">
      <ellipse cx="0" cy="0" rx="42" ry="38" fill="#ec4899"/>
      <rect x="-15" y="-15" width="8" height="24" rx="4" fill="#101012"/>
      <rect x="7" y="-15" width="8" height="24" rx="4" fill="#101012"/>
    </g>
    <g stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M28 30 Q 90 110 92 190"/>
      <path d="M110 250 Q 140 330 20 385"/>
    </g>
  </g>

  <text x="88" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#e6e6ea" letter-spacing="-2">open<tspan fill="url(#acc)">grok</tspan></text>
  <text x="92" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#9a9aad">run any model in Grok Bot — with the LiquidGlass Observatory</text>

  <!-- pipeline strip -->
  <g font-family="Consolas, Menlo, monospace" font-size="20">
    <rect x="92"  y="360" width="216" height="56" rx="12" fill="#1a1a22" stroke="#33334a"/>
    <text x="200" y="395" text-anchor="middle" fill="#c9c4ff">pick a model</text>
    <text x="322" y="395" text-anchor="middle" fill="#55556a">→</text>
    <rect x="336" y="360" width="216" height="56" rx="12" fill="#1a1a22" stroke="#33334a"/>
    <text x="444" y="395" text-anchor="middle" fill="#c9c4ff">wire map applies</text>
    <text x="566" y="395" text-anchor="middle" fill="#55556a">→</text>
    <rect x="580" y="360" width="216" height="56" rx="12" fill="#1a1a22" stroke="#33334a"/>
    <text x="688" y="395" text-anchor="middle" fill="#c9c4ff">verified hop</text>
    <text x="810" y="395" text-anchor="middle" fill="#55556a">→</text>
    <rect x="824" y="360" width="240" height="56" rx="12" fill="#17160f" stroke="#4a4633"/>
    <text x="944" y="395" text-anchor="middle" fill="#d8d8a0">survives updates</text>
  </g>

  <text x="92" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">keys stay on your machine · evidence-based maps · one command to start</text>

  <rect x="92" y="540" width="64" height="6" rx="3" fill="url(#acc)"/>
  <text x="92" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e6e6ea">not farming you, arming you.</text>
  <text x="1188" y="590" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="20" fill="#94a3b8">github.com/OnlyTerp/opengrok</text>
</svg>
